# ════════════════════════════════════════════════════════════════════════════
# DATAVEX ERP — edge vhost for erp.datavex.ai
#
# Deploy target : public / jump server (161.248.22.228) — NOT the ERP VM.
# Role          : TLS termination + reverse proxy
#                 erp.datavex.ai  →  172.30.20.19:80  (ERP VM nginx)
#
# This file only ADDS a server block for erp.datavex.ai. It never modifies an
# existing configuration: nginx selects this block solely on Host (port 80) /
# SNI (port 443) == erp.datavex.ai, so internal-devrepo.datavex.ai and every
# other site keep serving exactly as before.
#
# Applied by  : infrastructure/jump-server/apply-erp-domain.sh
# Certificate  : Let's Encrypt (HTTP-01 via the webroot below), issued by the
#                apply script before this file is installed.
# ════════════════════════════════════════════════════════════════════════════

# WebSocket / SSE upgrade support (unique variable name so it can never clash
# with a $connection_upgrade map defined by another project's config).
map $http_upgrade $erp_connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP : ACME challenges + redirect to HTTPS ─────────────────────────────
server {
    listen 80;
    server_name erp.datavex.ai;

    client_max_body_size 100m;

    # Let's Encrypt HTTP-01 — kept permanently so renewals keep working:
    #   certbot renew --webroot -w /var/www/erp-acme
    location /.well-known/acme-challenge/ {
        root /var/www/erp-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS : TLS termination → ERP VM (172.30.20.19:80) ────────────────────
server {
    listen 443 ssl;
    server_name erp.datavex.ai;

    ssl_certificate     /etc/letsencrypt/live/erp.datavex.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.datavex.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://172.30.20.19:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE (AI chat streaming, live updates)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $erp_connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
