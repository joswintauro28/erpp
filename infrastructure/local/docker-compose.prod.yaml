# ══════════════════════════════════════════════════════════════════════════════
# DATAVEX ERP — Local Single-Domain Testing Override
# ══════════════════════════════════════════════════════════════════════════════
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yaml up -d
#   OR:
#   .\docker-build.ps1 up -Mode prod
#
# Tests the single-domain (path-based) routing locally at http://erp.local
# No SSL — HTTP only on port 80.
#
# PREREQUISITE:
#   Add to hosts file: 127.0.0.1 erp.local
#   (Run setup-hosts.ps1 as Administrator)
# ══════════════════════════════════════════════════════════════════════════════

name: datavex-erp

services:

  # ─── ERP Shell — basePath /admin ─────────────────────────────────────────
  erp-shell:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: /admin
        NEXT_PUBLIC_DEPLOY_MODE: single-domain
        # Same-origin relative paths: redirects/links stay on whichever host
        # serves the app (erp.datavex.ai, erp.local, localhost) instead of
        # bouncing users off to a hardcoded domain.
        NEXT_PUBLIC_BILLING_APP_URL: /billing
        NEXT_PUBLIC_CRM_APP_URL: /crm
        NEXT_PUBLIC_INVENTORY_APP_URL: /inventory
    environment:
      NEXT_PUBLIC_BASE_PATH: /admin
      NEXT_PUBLIC_DEPLOY_MODE: single-domain
      NEXT_PUBLIC_BILLING_APP_URL: /billing
      NEXT_PUBLIC_CRM_APP_URL: /crm
      NEXT_PUBLIC_INVENTORY_APP_URL: /inventory
      CORS_ORIGINS: http://erp.local
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/admin', (res) => { if (res.statusCode >= 200 && res.statusCode < 400) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]

  # ─── CRM Shell — basePath /crm ──────────────────────────────────────────
  crm-shell:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: /crm
        NEXT_PUBLIC_DEPLOY_MODE: single-domain
        NEXT_PUBLIC_SHELL_APP_URL: /admin
        NEXT_PUBLIC_APP_URL: /crm
    environment:
      NEXT_PUBLIC_DEPLOY_MODE: single-domain
      NEXT_PUBLIC_SHELL_APP_URL: /admin
      NEXT_PUBLIC_APP_URL: /crm
      CORS_ORIGINS: http://erp.local

  # ─── Billing UI — basePath /billing ─────────────────────────────────────
  billing-ui:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: /billing
        NEXT_PUBLIC_DEPLOY_MODE: single-domain
        NEXT_PUBLIC_SHELL_APP_URL: /admin
        NEXT_PUBLIC_APP_URL: /billing
    environment:
      NEXT_PUBLIC_DEPLOY_MODE: single-domain
      NEXT_PUBLIC_SHELL_APP_URL: /admin
      NEXT_PUBLIC_APP_URL: /billing
      CORS_ORIGINS: http://erp.local
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/billing', (res) => { if (res.statusCode >= 200 && res.statusCode < 400) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]

  # ─── Inventory UI — basePath /inventory ─────────────────────────────────
  inventory-ui:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: /inventory
        NEXT_PUBLIC_DEPLOY_MODE: single-domain
        NEXT_PUBLIC_SHELL_APP_URL: /admin
        NEXT_PUBLIC_APP_URL: /inventory
    environment:
      NEXT_PUBLIC_DEPLOY_MODE: single-domain
      NEXT_PUBLIC_SHELL_APP_URL: /admin
      NEXT_PUBLIC_APP_URL: /inventory
      CORS_ORIGINS: http://erp.local
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3004/inventory', (res) => { if (res.statusCode >= 200 && res.statusCode < 400) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]

  # ─── RustFS — S3 reverse proxy env vars ──────────────────────────────────
  rustfs:
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"

  # ─── Backend services — Update CORS & routing for single domain ─────────
  erp-service:
    environment:
      CORS_ORIGINS: https://${MAIN_DOMAIN:-erp.datavex.ai},http://${MAIN_DOMAIN:-erp.datavex.ai},http://erp.local,http://localhost
      RUSTFS_PUBLIC_URL: http://erp.local/rustfs
      FRONTEND_URL: http://erp.local/admin

  crm-service:
    environment:
      CORS_ORIGINS: https://${MAIN_DOMAIN:-erp.datavex.ai},http://${MAIN_DOMAIN:-erp.datavex.ai},http://erp.local,http://localhost

  billing-service:
    environment:
      CORS_ORIGINS: https://${MAIN_DOMAIN:-erp.datavex.ai},http://${MAIN_DOMAIN:-erp.datavex.ai},http://erp.local,http://localhost

  inventory-service:
    environment:
      CORS_ORIGINS: https://${MAIN_DOMAIN:-erp.datavex.ai},http://${MAIN_DOMAIN:-erp.datavex.ai},http://erp.local,http://localhost
      FRONTEND_URL: http://erp.local/inventory

  ai-service:
    environment:
      CORS_ORIGINS: https://${MAIN_DOMAIN:-erp.datavex.ai},http://${MAIN_DOMAIN:-erp.datavex.ai},http://erp.local,http://localhost

  core-iam:
    environment:
      COOKIE_DOMAIN: erp.local
      CORS_ORIGINS: https://${MAIN_DOMAIN:-erp.datavex.ai},http://${MAIN_DOMAIN:-erp.datavex.ai},http://erp.local,http://localhost

  # ─── Nginx — Switch to single-domain config ─────────────────────────────
  nginx:
    volumes:
      - type: bind
        source: ./nginx/single-domain.conf
        target: /etc/nginx/nginx.conf
        read_only: true

volumes:
  postgres_data:
    name: datavex-erp_postgres_data
  rustfs_data:
    name: datavex-erp_rustfs_data
  rabbitmq_data:
    name: datavex-erp_rabbitmq_data
